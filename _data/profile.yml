short_bio: >-
  <p>Hi, I'm Caden! I'm a space scientist and engineer.</p>
  <table class="tg">
  <thead>
    <tr>
      <th>Science/Research</th>
      <th>Engineering/Operations</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>
        My scientific research mainly focuses on transient astrophysical phenomena such as
        supernovae and gamma-ray bursts. I collect and analyze photometric and spectroscopic data
        from telescopes around the world (and in space) to try to better understand these energetic
        cosmic explosions. My interests also include instrument design and observatory
        operations&mdash;I'm currently leading the design &amp; construction of a fiber-fed
        spectrograph for optical transient classification.
      </td>
      <td>
        I am also a professional software developer with several years of experience in space
        mission operations, integration, and testing. I have worked on a number of <abbr
        title="National Aeronautics and Space Administration">NASA</abbr> science missions, both
        pre- and post-launch, and my expertise includes spacecraft telemetry processing, operations
        engineering &amp; automation, and the preparation of data products for archiving and
        further scientific use.
      </td>
    </tr>
  </tbody>
  </table>

