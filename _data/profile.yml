short_bio: >-
  <p>Hi, I'm Caden! I'm a space scientist and software developer. I've previously worked on a number
  of <abbr title="National Aeronautics and Space Administration">NASA</abbr> science missions, and
  currently work on transient astrophysical phenomena such as supernovae and gamma-ray bursts. I am
  a "full-stack" scientist, with interests and experience spanning everything from handling raw
  spacecraft telemetry to instrument and infrastructure design to data reduction &amp; analysis.</p>

