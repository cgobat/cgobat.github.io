short_bio: >-
  <p>Hi, I'm Caden! I develop software for space science and spacecraft operations. I work on a
  number of <abbr title="National Aeronautics and Space Administration">NASA</abbr> science missions
  and have previously conducted research in high-energy astrophysics, using multiwavelength data
  from space and ground-based telescopes around the world. I am passionate about developing
  innovative software, technology, and instrumentation to enable scientific discoveries across a
  range of disciplines.</p>

